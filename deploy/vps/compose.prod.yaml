# StillOn em produção numa VPS (Plano 11, spec §2; spec 2026-10-13-vps-
# compartilhada). Fica em /opt/stillon/compose.prod.yaml, ao lado do
# Caddyfile, do initdb.sh e do .env (segredos, root 600, fora do git; modelo
# em deploy/vps/env.exemplo). Depende da rede edge da borda do host.
#
# O compose.yaml da raiz do repositório NÃO vai para o servidor: ele tem o
# seed do usuário de demonstração e chaves públicas (obrigação 5).
#
# Quem sobe e troca a versão é o /usr/local/sbin/stillon-entrada (verbo
# deploy), com STILLON_SHA no ambiente. Sem ela, a imagem é stillon:atual,
# que a entrada move para a versão saudável depois de cada deploy: assim um
# `docker compose logs` ou `exec` à mão, em /opt/stillon, funciona sem
# variável nenhuma.
#
# Os valores vêm do /opt/stillon/.env pela interpolação do compose (o .env
# do diretório do projeto), e cada serviço recebe SÓ as variáveis de que
# precisa: o Caddy não vê segredo nenhum, e o app não vê a senha do
# superusuário nem a do backup. Os valores fixos (TRUSTED_PROXIES e cia.)
# ficam aqui, e não no .env: uma linha errada lá não os muda.
name: stillon

# Rotação de log por serviço, além do daemon.json do runbook: um log sem
# teto enche o disco da VPS.
x-log: &log
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    # caddy:2 por digest (a tag fica no nome). O Dependabot atualiza este
    # digest e o do Postgres (ecossistema docker-compose, /deploy/vps).
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    # Nenhuma porta publicada (obrigação 3). Quem ouve a 80 e a 443 da VPS é
    # a borda do host (/srv/edge), dividida com o GoblinShift: ela faz o TLS
    # e encaminha o domínio para cá pela rede edge. Este Caddy é o único
    # contêiner do StillOn naquela rede: o app e o banco ficam fora do
    # alcance dos outros projetos.
    environment:
      STILLON_DOMINIO: ${STILLON_DOMINIO:?defina STILLON_DOMINIO no /opt/stillon/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      stillon:
        ipv4_address: 10.30.0.2
      edge:
        # O IP reservado ao StillOn na rede da borda (ADR 014 do GoblinShift),
        # fora da faixa dinâmica (.128/25), e o que o trecho da borda
        # (deploy/vps/edge/stillon.caddy) usa. IP, e não alias: outro
        # contêiner com o mesmo alias dividiria o tráfego em silêncio; com o
        # mesmo IP, o Docker recusa.
        ipv4_address: 172.31.0.3
    # Tetos na VPS de 2 vCPUs dividida com outros projetos. O Caddy só
    # repassa à borda (pico medido de 23 MiB): um quarto de CPU e 128 MiB.
    # TestProductionComposeLimitsEveryService.
    cpus: 0.25
    mem_limit: 128m
    # Sem NET_RAW, o Caddy não forja ARP nem pacote cru na rede edge, dividida
    # com os outros projetos. Ele ouve a 80 como root e não precisa dela; as
    # demais capacidades padrão ficam (NET_BIND_SERVICE, troca de dono).
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    logging: *log
    restart: unless-stopped

  app:
    # A imagem que o stillon-entrada carregou do tar do deploy.yml (o layout
    # OCI do `crane pull --format oci`, com o manifesto publicado, o mesmo
    # que passou no Trivy), etiquetada localmente. pull_policy never:
    # sem ela, uma imagem ausente viraria um pull de docker.io/library/stillon.
    image: stillon:${STILLON_SHA:-atual}
    pull_policy: never
    command: ["--role=all"]
    environment:
      DATABASE_URL: postgres://stillon_app:${STILLON_APP_PASSWORD:?defina STILLON_APP_PASSWORD no /opt/stillon/.env}@10.30.0.4:5432/stillon?sslmode=disable
      # Com https, o boot recusa as chaves de demonstração e liga o cookie
      # Secure (obrigação 5).
      PUBLIC_BASE_URL: https://${STILLON_DOMINIO:?defina STILLON_DOMINIO no /opt/stillon/.env}
      CORS_ORIGIN: https://${STILLON_DOMINIO}
      # O IP fixo do Caddy, e o CLIENT_IP_HEADER vazio: o app lê o último
      # salto do X-Forwarded-For, que o Caddy reescreve com o IP do cliente
      # que a borda informou (obrigação 2).
      TRUSTED_PROXIES: 10.30.0.2/32
      CLIENT_IP_HEADER: ""
      METRICS_ADDR: "off"
      LOG_LEVEL: info
      # Abaixo do mem_limit (obrigação 4): o GC aperta antes do OOM killer. A
      # folga (128 MiB) é a memória que o GOMEMLIMIT não conta (pilhas das
      # goroutines, binário, buffers do kernel contados no cgroup). Os 384 MiB
      # cobrem o pior caso do Argon2id: 4 vagas de 64 MiB (o teto padrão de
      # ARGON2_MAX_CONCURRENT) mais o heap do sondador.
      GOMEMLIMIT: 384MiB
      MASTER_KEY: ${MASTER_KEY:?defina MASTER_KEY no /opt/stillon/.env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no /opt/stillon/.env}
      IP_HASH_KEY: ${IP_HASH_KEY:?defina IP_HASH_KEY no /opt/stillon/.env}
      # Vazios, o canal de e-mail fica indisponível (o app sobe).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    healthcheck:
      # A imagem não tem shell: o próprio binário checa o /readyz (D5 do
      # Plano 7). O stillon-entrada espera este healthcheck no deploy.
      test: ["CMD", "/stillon", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 500ms
    networks:
      stillon:
        ipv4_address: 10.30.0.3
    # Meia CPU: o sondador espera rede, e o pico de CPU é o Argon2id do login
    # (~120 ms com CPU livre, perto do dobro no teto), raro num monitor de um
    # dono. Memória: pico medido de 13 MiB sem login; o teto é o GOMEMLIMIT
    # acima mais a folga.
    cpus: 0.5
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # O binário não escreve em disco (o backup roda o helper num Postgres
    # descartável, e não aqui): nada de tmpfs. TestComposeProdAppIsReadOnly.
    read_only: true
    logging: *log
    restart: unless-stopped
    # O padrão do Docker é SIGKILL 10 s depois do SIGTERM, e o app se dá 15 s
    # (config.shutdownGrace) para fechar as sondas em voo, gravar os checks e
    # marcar os avisos entregues. Com folga acima disso; o teste
    # TestComposeProdGracePeriodCoversTheAppShutdown confere.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy

  db:
    # O MESMO digest de deploy/vps/db/Dockerfile, do compose.yaml, da perna 18
    # do ci.yml e do testdb (TestPostgres18DigestIsTheSameEverywhere).
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      # Superusuário só para o init e para a operação à mão; o app usa
      # stillon_app, e o backup, stillon_backup (initdb.sh).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no /opt/stillon/.env}
      STILLON_APP_PASSWORD: ${STILLON_APP_PASSWORD:?defina STILLON_APP_PASSWORD no /opt/stillon/.env}
      STILLON_BACKUP_PASSWORD: ${STILLON_BACKUP_PASSWORD:?defina STILLON_BACKUP_PASSWORD no /opt/stillon/.env}
    volumes:
      # Layout do 18: o volume é /var/lib/postgresql (D11 do Plano 7).
      - pgdata:/var/lib/postgresql
      # Só roda com o volume vazio (primeira subida). Trocar a senha no .env
      # depois disso NÃO muda a do banco: runbook.
      - ./initdb.sh:/docker-entrypoint-initdb.d/10-stillon.sh:ro
    healthcheck:
      # Pelo TCP: durante o init o servidor temporário só escuta no socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "stillon_app", "-d", "stillon"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 500ms
    # Nenhum `ports:` (obrigação 3): nem para o backup, que roda dentro da
    # rede (stillon-entrada backup).
    networks:
      stillon:
        ipv4_address: 10.30.0.4
    # Meia CPU e 512 MiB: pico medido de 55 MiB, e o pior caso cabe com
    # folga (shared_buffers padrão de 128 MB, os backends do app e o do
    # pg_dump do backup, o autovacuum). O restauro de teste e o snapshot do
    # backup rodam num Postgres descartável, com teto próprio, e não aqui.
    cpus: 0.5
    mem_limit: 512m
    # O entrypoint do Postgres roda como root só para acertar dono e modo do
    # volume e do /var/run/postgresql (CHOWN, DAC_OVERRIDE, FOWNER) e trocar
    # para o usuário postgres (SETGID, SETUID). Sem nenhuma, o chown do volume
    # falha e o banco não sobe. O job vps do CI prova subida, reinício, backup
    # e restauro com este conjunto (TestComposeProdDBDropsCapabilities).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging: *log
    restart: unless-stopped

networks:
  stillon:
    # Sem IPv6 (obrigação 3): o sondador não ganha um caminho por um prefixo
    # que o safedial não bloqueia.
    enable_ipv6: false
    ipam:
      config:
        # Fora dos default-address-pools do daemon.json da VPS (172.16/12 e
        # 192.168/16): nenhuma rede criada por outro projeto toma esta faixa.
        - subnet: 10.30.0.0/24
          gateway: 10.30.0.1
          # Os IPs dinâmicos (o Postgres descartável do backup) saem da
          # metade de cima; os fixos (.2, .3, .4) ficam fora do sorteio.
          ip_range: 10.30.0.128/25
  edge:
    # A rede da borda do host, criada pelo compose dela (/srv/edge).
    # Externa: o StillOn nunca a cria nem a apaga.
    external: true
    name: edge

volumes:
  pgdata:
