# Configuração do gitleaks (D37 do Plano 7). Estende as regras padrão: todas
# continuam ativas; aqui só se tiram valores conferidos à mão.
[extend]
useDefault = true

[[allowlists]]
description = "Chaves de demonstração públicas do compose"
# As chaves de demonstração do compose.yaml (MASTER_KEY, JWT_SECRET e
# IP_HASH_KEY), em base64: as três de hoje, de "demo-stillon-…-naouse", e as
# três do nome anterior do projeto, que seguem no histórico que o CI varre.
# Estão no repositório de propósito e são públicas: o boot recusa as seis
# quando PUBLIC_BASE_URL é https (Task 2 do Plano 7; D13 e D14 do Plano 7).
# Só estes seis valores exatos, ancorados; nada de padrão largo. Se uma chave
# de demo mudar, a linha daqui muda junto, e o gitleaks roda de novo.
# Só a regra que as pega; as outras continuam vendo estes valores.
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^ZGVtby1zdGlsbG9uLU1BU1RFUl9LRVktbmFvdXNlISE=$''',
  '''^ZGVtby1zdGlsbG9uLUpXVF9TRUNSRVQtbmFvdXNlISE=$''',
  '''^ZGVtby1zdGlsbG9uLUlQX0hBU0hfS0VZLW5hb3VzZSE=$''',
  '''^ZGVtby12aWdpbHVtZS1NQVNURVJfS0VZLW5hb3VzZSE=$''',
  '''^ZGVtby12aWdpbHVtZS1KV1RfU0VDUkVULW5hb3VzZSE=$''',
  '''^ZGVtby12aWdpbHVtZS1JUF9IQVNIX0tFWS1uYW91c2U=$''',
]
