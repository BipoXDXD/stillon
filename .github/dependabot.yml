# Atualizações de dependência (spec §5.9; D20 do Plano 7). Tudo o que o
# repositório fixa por versão, SHA ou digest tem de ter quem o atualize, ou a
# fixação vira atraso: um CVE corrigido na base fica na imagem para sempre.
#
# As imagens que só um workflow usa (o Trivy do ci.yml; o Postgres do
# backup.yml é o de produção) têm um Dockerfile de uma linha cada, lido pelo
# workflow: o Dependabot não lê o `env` de um workflow. Ficam à mão:
# - as versões das ferramentas Go no env do ci.yml (sqlc, staticcheck, gosec,
#   govulncheck, gitleaks, actionlint) e o crane do deploy.yml;
# - os digests do Postgres 17 e 18 na matriz do job test do ci.yml;
# - o imagemPadrao de internal/storage/testdb (o mesmo digest do 18).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
    # Uma versão recém-publicada espera 7 dias antes de entrar no PR
    # agrupado: tempo para uma versão maliciosa ser descoberta e retirada
    # (banco S2 da revisão; D2 do Plano 10). Só vale para atualização de
    # versão: as de segurança não esperam (documentação do GitHub, cooldown).
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      painel:
        patterns: ['*']
    # Uma versão recém-publicada espera 7 dias antes de entrar no PR
    # agrupado: tempo para uma versão maliciosa ser descoberta e retirada
    # (banco S2 da revisão; D2 do Plano 10). Só vale para atualização de
    # versão: as de segurança não esperam (documentação do GitHub, cooldown).
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # O Dockerfile do app (node, golang, distroless); o do Postgres de
  # produção (deploy/vps/db, o ponto fixo do digest) e o do Trivy do CI.
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/vps/db
      - /deploy/ci/trivy
    schedule:
      interval: weekly
    # Versão MAIOR de Postgres e Node não vem por PR: o Postgres maior é dump
    # e restauração num app novo (D36; runbook, "Upgrade maior"), e o Node
    # maior muda o que o build do painel exige. Menores e digests, sim.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # O Postgres do compose.yaml, o mesmo digest do de produção; e o
  # compose.prod.yaml da VPS (Caddy e Postgres).
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/vps
    schedule:
      interval: weekly
    # Versão MAIOR de Postgres e Node não vem por PR: o Postgres maior é dump
    # e restauração num app novo (D36; runbook, "Upgrade maior"), e o Node
    # maior muda o que o build do painel exige. Menores e digests, sim.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      - dependency-name: node
        update-types: ['version-update:semver-major']
