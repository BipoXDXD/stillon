name: ci
on:
  push:
    branches: [main]
  pull_request:

# Nenhum job escreve nada por padrão. Quem precisa de mais pede no job.
permissions:
  contents: read

# shell: bash dá `bash -eo pipefail` a todo run. O padrão do GitHub é
# `bash -e`, sem pipefail: um `comando | tee log` que falha deixaria o passo
# verde, porque o código do pipe é o do tee.
defaults:
  run:
    shell: bash

# Um push novo no mesmo ref (PR, main ou tag) cancela a execução anterior:
# com o repositório privado, os minutos de Actions contam na cota (2.000/mês),
# e uma execução superada não prova nada. Na main, o publish da execução
# nova substitui o da cancelada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions fixadas por SHA completo (a tag vem no comentário) e ferramentas com
# versão: uma tag móvel roda código alheio com o GITHUB_TOKEN, e @latest muda
# o resultado do CI sem commit nenhum (D20 do Plano 7). O Dependabot atualiza.
env:
  SQLC_VERSION: v1.31.1
  STATICCHECK_VERSION: v0.8.1
  GOSEC_VERSION: v2.29.0
  GOVULNCHECK_VERSION: v1.8.0
  GITLEAKS_VERSION: v8.30.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Chave própria, diferente da do test: o setup-go não tem sufixo de
          # chave, só o hash destes arquivos. O ci.yml entra porque as versões
          # das ferramentas instaladas aqui moram no env dele.
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml

      - name: sqlc diff
        # Código gerado desatualizado em relação ao SQL é o erro que o sqlc
        # existe para impedir; o CI o transforma em falha de build.
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}
          sqlc diff

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          staticcheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          gosec -quiet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

  test:
    # Produção roda o 18; a perna do 17 mantém o código compatível com um
    # Postgres que ainda não tenha o 18 (Reconciliação 7 do contrato). Uma
    # migration com uuidv7() nativo, por exemplo, fica vermelha aqui.
    strategy:
      fail-fast: false
      matrix:
        # Por digest, com a tag na string. O Dependabot não atualiza estas
        # strings: a mão, junto com o digest de deploy/fly/db/Dockerfile (o
        # 18 é o de produção, igual ao do Dockerfile, do compose.yaml e do
        # testdb) e com o imagemPadrao de internal/storage/testdb.
        include:
          - label: postgres:17-alpine
            image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          - label: postgres:18-alpine
            image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Só o go.sum: a chave difere da do lint (que também hashia o
          # ci.yml). As duas pernas compilam o mesmo código com as mesmas
          # flags, então dividem a chave; o cache delas é equivalente.
          cache-dependency-path: go.sum

      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

  secrets:
    # O histórico INTEIRO, em todo PR: com o repositório privado, um segredo
    # commitado hoje fica público no dia em que ele abrir. Os falsos positivos
    # conferidos à mão ficam no .gitleaksignore, pela fingerprint (D37); as
    # chaves de demo públicas do compose, no allowlist do .gitleaks.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}
          gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
