name: Forwarding audit - stored StillOn recovery
on:
  workflow_dispatch:
    inputs:
      delayed:
        description: Wait for the scheduled review window
        type: boolean
        default: true
        required: true
      periodic:
        description: Use the repeating 18-hour audit interval
        type: boolean
        default: false
      repeat:
        description: Keep renewing recovery evidence independently
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: forwarding-audit-stillon
  cancel-in-progress: false
jobs:
  wait:
    name: Scheduled audit gate
    runs-on: ubuntu-24.04
    environment: ${{ inputs.periodic && 'forwarding-audit-periodic-20261023' || inputs.delayed && 'forwarding-audit-wait-20261023' || 'forwarding-audit-now-20261023' }}
    timeout-minutes: 5
    steps:
      - run: echo 'Read-only evidence renewal; no production deployment.'
  restore:
    name: Restore stored encrypted backup
    needs: wait
    runs-on: ubuntu-24.04
    environment: forwarding-audit-restore-20261023
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -yq age
      - name: Recover stored artifact in isolated PostgreSQL
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_IDENTITY: ${{ secrets.STILLON_BACKUP_AGE_IDENTITY }}
        run: python3 deploy/backup/restore-stored-audit.py

  renew-next:
    name: Schedule the next isolated revalidation
    needs: restore
    if: always() && !cancelled() && inputs.repeat
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUDIT_REF: ${{ github.ref_name }}
        run: gh workflow run backup.yml --ref "$AUDIT_REF" -f delayed=true -f periodic=true -f repeat=true
