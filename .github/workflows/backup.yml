name: Forwarding audit - stored StillOn recovery
on:
  workflow_dispatch:
    inputs:
      delayed:
        description: Wait for the scheduled review window
        type: boolean
        default: true
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: forwarding-audit-stillon
  cancel-in-progress: false
jobs:
  wait:
    name: Scheduled audit gate
    runs-on: ubuntu-24.04
    environment: ${{ inputs.delayed && 'forwarding-audit-wait-20261023' || 'forwarding-audit-now-20261023' }}
    timeout-minutes: 5
    steps:
      - run: echo 'Read-only evidence renewal; no production deployment.'
  restore:
    name: Restore stored encrypted backup
    needs: wait
    runs-on: ubuntu-24.04
    environment: forwarding-audit-restore-20261023
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -yq age
      - name: Recover stored artifact in isolated PostgreSQL
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_IDENTITY: ${{ secrets.STILLON_BACKUP_AGE_IDENTITY }}
        run: python3 deploy/backup/restore-stored-audit.py
